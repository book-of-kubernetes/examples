---
- name: gpg key
  ansible.builtin.get_url:
    url: "{{ crio_repo }}/Release.key"
    dest: /etc/apt/keyrings/cri-o.asc
    mode: '0644'

- name: cri-o repository
  ansible.builtin.deb822_repository:
    name: cri-o
    uris: "{{ crio_repo }}/"
    suites: /
    signed_by: /etc/apt/keyrings/cri-o.asc
    install_python_debian: true

- name: install
  ansible.builtin.apt:
    name: cri-o
    update_cache: yes

- name: skopeo
  ansible.builtin.apt:
    name: skopeo
  when: crio_skopeo

- name: service
  ansible.builtin.service:
    name: crio
    state: started
    enabled: yes

- name: cni plugins directory
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: '0755'
  when: crio_cni

- name: cni plugins
  ansible.builtin.unarchive:
    src: "{{ cni_plugin_url }}"
    dest: /opt/cni/bin
    remote_src: yes
  when: crio_cni

- name: cni config directory
  ansible.builtin.file:
    path: /etc/cni/net.d
    state: directory
    mode: '0755'
  when: crio_cni

- name: cni config
  ansible.builtin.copy:
    src: 100-crio-bridge.conf
    dest: /etc/cni/net.d/100-crio-bridge.conf
    owner: root
    group: root
    mode: '0644'
  when: crio_cni
